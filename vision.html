<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision — Tanpa Login</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; background: #0b0b0d; color: #e8e8ea; }
        h1 { font-size: 22px; }
        img { max-width: 320px; border-radius: 12px; display: block; margin: 16px 0; border: 1px solid #26262d; }
        #out { white-space: pre-wrap; background: #1a1a1f; border: 1px solid #26262d; border-radius: 12px; padding: 16px; min-height: 60px; line-height: 1.6; }
        button { padding: 10px 20px; background: #7c5cff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:disabled { opacity: .5; }
        .note { color: #8a8a93; font-size: 13px; }
        a { color: #9d86ff; }
        input[type=file] { margin: 12px 0; color: #ccc; }
    </style>
</head>
<body>
    <h1>◆ Vision — Analisis Gambar</h1>
    <p class="note">Tanpa login · aiautotagging.com (Cloudflare Workers AI) · 500/hari</p>
    <img id="pic" src="https://assets.puter.site/doge.jpeg" alt="doge" crossorigin="anonymous">
    <div>
        <input type="file" id="file" accept="image/*">
        <button id="go">Analisis Gambar</button>
    </div>
    <div id="out">Klik tombol untuk menganalisis gambar di atas (atau upload gambar sendiri).</div>
    <p><a href="index.html">← Kembali</a></p>
    <script>
        const out = document.getElementById('out');
        const pic = document.getElementById('pic');
        const fileIn = document.getElementById('file');
        const go = document.getElementById('go');
        let currentBlob = null;

        async function urlToBlob(url) {
            const r = await fetch(url, { mode: 'cors' });
            if (!r.ok) throw new Error('Gagal unduh gambar: ' + r.status);
            return await r.blob();
        }

        fileIn.onchange = () => {
            const f = fileIn.files[0];
            if (!f) return;
            currentBlob = f;
            pic.src = URL.createObjectURL(f);
            out.textContent = 'File dipilih: ' + f.name;
        };

        function parseVision(respText) {
            try {
                const j = JSON.parse(respText);
                if (j.raw) {
                    const m = j.raw.match(/Image description:\s*([\s\S]+?)(?:\n\nHere is my approach|\n```|$)/i);
                    if (m) return m[1].trim();
                    const desc = j.raw.match(/"description"\s*:\s*"([^"]+)"/);
                    if (desc) return desc[1];
                    return j.raw.split('\n').filter(l => l.trim() && !l.includes('```')).slice(0, 6).join('\n').slice(0, 600);
                }
                if (j.error || j.code) throw new Error(j.message || j.code);
                return JSON.stringify(j, null, 2).slice(0, 600);
            } catch (e) {
                if (e.message && !e.message.includes('JSON')) throw e;
                return respText.slice(0, 600);
            }
        }

        go.onclick = async () => {
            go.disabled = true;
            out.textContent = 'Menganalisis… (±10–20 detik)';
            try {
                const blob = currentBlob || await urlToBlob(pic.src.startsWith('blob:') ? pic.src : 'https://assets.puter.site/doge.jpeg');
                const fd = new FormData();
                fd.append('file', blob, 'image.jpg');
                fd.append('options', JSON.stringify({ maxTags: 10 }));
                const res = await fetch('https://aiautotagging.com/api/tag/image', { method: 'POST', body: fd });
                const text = await res.text();
                if (!res.ok) throw new Error('API ' + res.status + ': ' + text.slice(0, 150));
                out.textContent = parseVision(text);
            } catch (e) {
                out.textContent = 'Error: ' + e.message;
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
