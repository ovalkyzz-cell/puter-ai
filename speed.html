<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Test — Tanpa Login</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; background: #0b0b0d; color: #e8e8ea; }
        h1 { font-size: 22px; }
        .note { color: #8a8a93; font-size: 13px; }
        button { padding: 10px 20px; background: #7c5cff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:disabled { opacity: .5; }
        #out { white-space: pre-wrap; background: #1a1a1f; border: 1px solid #26262d; border-radius: 12px; padding: 16px; min-height: 80px; margin-top: 12px; line-height: 1.7; }
        .big { font-size: 32px; font-weight: 700; color: #9d86ff; }
        table { border-collapse: collapse; margin-top: 10px; width: 100%; }
        td, th { border: 1px solid #26262d; padding: 8px 10px; text-align: left; font-size: 14px; }
        a { color: #9d86ff; }
    </style>
</head>
<body>
    <h1>◆ Speed Test (latency + TTFB + stream)</h1>
    <p class="note">Tanpa login · Mengukur waktu respons Pollinations (pengganti serviceSpeed Puter)</p>
    <button id="go">Jalankan Tes</button>
    <div id="out">Klik tombol untuk mengukur.</div>
    <p><a href="index.html">← Kembali</a></p>
    <script>
        const out = document.getElementById('out');
        const go = document.getElementById('go');

        go.onclick = async () => {
            go.disabled = true;
            out.textContent = 'Menjalankan…';
            const rows = [];
            try {
                // 1) non-stream latency
                let t0 = performance.now();
                const res = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai-fast',
                        messages: [{ role: 'user', content: 'Explain closures in one paragraph.' }],
                    }),
                });
                const ttfb = performance.now() - t0;
                if (!res.ok) {
                    const t = await res.text();
                    if (res.status === 402) throw new Error('Rate limit — tunggu ±45 detik.');
                    throw new Error('API ' + res.status + ': ' + t.slice(0, 120));
                }
                const data = await res.json();
                const total1 = performance.now() - t0;
                const content = data.choices?.[0]?.message?.content || '';
                rows.push(['Non-stream total', Math.round(total1) + ' ms']);
                rows.push(['Model', data.model || 'openai-fast']);
                rows.push(['Chars', String(content.length)]);

                // 2) stream first-chunk latency
                t0 = performance.now();
                const sres = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai-fast',
                        stream: true,
                        messages: [{ role: 'user', content: 'Count 1 to 5.' }],
                    }),
                });
                if (sres.ok) {
                    const reader = sres.body.getReader();
                    const dec = new TextDecoder();
                    let buf = '', firstChunk = null, full = '';
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buf += dec.decode(value, { stream: true });
                        const lines = buf.split('\n');
                        buf = lines.pop() || '';
                        for (const line of lines) {
                            if (!line.startsWith('data:')) continue;
                            const d = line.slice(5).trim();
                            if (d === '[DONE]') continue;
                            try {
                                const j = JSON.parse(d);
                                const c = j.choices?.[0]?.delta?.content || '';
                                if (c) {
                                    if (firstChunk == null) firstChunk = performance.now() - t0;
                                    full += c;
                                }
                            } catch {}
                        }
                        if (firstChunk != null && full.length > 20) break;
                    }
                    rows.push(['Stream first text', firstChunk != null ? Math.round(firstChunk) + ' ms' : 'n/a']);
                    rows.push(['Stream sample', full.slice(0, 60)]);
                } else {
                    rows.push(['Stream', 'skip (' + sres.status + ')']);
                }

                out.innerHTML = '<span class="big">' + Math.round(total1) + ' ms</span>\n\n' +
                    '<table><tr><th>Metrik</th><th>Nilai</th></tr>' +
                    rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') +
                    '</table>';
            } catch (e) {
                out.textContent = 'Error: ' + e.message;
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
