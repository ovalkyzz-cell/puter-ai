<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Test</title>
    <link rel="stylesheet" href="features.css">
    <style>
        :root { --c: #f87171; }
        .big { font-size: 36px; font-weight: 800; color: var(--c); font-family: var(--mono); letter-spacing: -1px; }
        table { border-collapse: collapse; margin-top: 12px; width: 100%; }
        td, th { border: 1px solid var(--border); padding: 9px 12px; text-align: left; font-size: 13.5px; }
        th { background: rgba(255,255,255,.04); color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .6px; }
    </style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 1 9-9"/><path d="M12 12l5-5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
            </div>
            <div>
                <h1>Speed Test <span class="badge">GRATIS</span></h1>
                <p class="note" style="margin:4px 0 0">Latency · TTFB · stream first-chunk · tanpa login</p>
            </div>
        </div>

        <div class="card">
            <h2>Ukur respons Pollinations</h2>
            <button id="go">Jalankan Tes</button>
            <div id="out">Klik tombol untuk mengukur.</div>
        </div>

        <a class="back" href="index.html">← Kembali</a>
    </div>
    <script>
        const out = document.getElementById('out');
        const go = document.getElementById('go');
        go.onclick = async () => {
            go.disabled = true;
            out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span> Menjalankan…';
            const rows = [];
            try {
                let t0 = performance.now();
                const res = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai-fast',
                        messages: [{ role: 'user', content: 'Explain closures in one paragraph.' }],
                    }),
                });
                const ttfb = performance.now() - t0;
                if (!res.ok) {
                    if (res.status === 402) throw new Error('Rate limit — tunggu ±45 detik.');
                    throw new Error('API ' + res.status);
                }
                const data = await res.json();
                const total1 = performance.now() - t0;
                const content = data.choices?.[0]?.message?.content || '';
                rows.push(['Non-stream total', Math.round(total1) + ' ms']);
                rows.push(['TTFB-ish', Math.round(ttfb) + ' ms']);
                rows.push(['Model', data.model || 'openai-fast']);
                rows.push(['Chars', String(content.length)]);

                t0 = performance.now();
                const sres = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai-fast',
                        stream: true,
                        messages: [{ role: 'user', content: 'Count 1 to 5.' }],
                    }),
                });
                if (sres.ok) {
                    const reader = sres.body.getReader();
                    const dec = new TextDecoder();
                    let buf = '', firstChunk = null, full = '';
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buf += dec.decode(value, { stream: true });
                        const lines = buf.split('\n');
                        buf = lines.pop() || '';
                        for (const line of lines) {
                            if (!line.startsWith('data:')) continue;
                            const d = line.slice(5).trim();
                            if (d === '[DONE]') continue;
                            try {
                                const j = JSON.parse(d);
                                const c = j.choices?.[0]?.delta?.content || '';
                                if (c) {
                                    if (firstChunk == null) firstChunk = performance.now() - t0;
                                    full += c;
                                }
                            } catch {}
                        }
                        if (firstChunk != null && full.length > 20) break;
                    }
                    rows.push(['Stream first text', firstChunk != null ? Math.round(firstChunk) + ' ms' : 'n/a']);
                    rows.push(['Stream sample', full.slice(0, 60)]);
                } else {
                    rows.push(['Stream', 'skip (' + sres.status + ')']);
                }

                out.innerHTML = '<span class="big">' + Math.round(total1) + ' ms</span>\n\n' +
                    '<table><tr><th>Metrik</th><th>Nilai</th></tr>' +
                    rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') +
                    '</table>';
            } catch (e) {
                out.textContent = 'Error: ' + e.message;
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
