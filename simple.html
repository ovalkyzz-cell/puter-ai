<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Dasar Claude</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; background: #0b0b0d; color: #e8e8ea; }
        h1 { font-size: 22px; }
        #out { white-space: pre-wrap; background: #1a1a1f; border: 1px solid #26262d; border-radius: 12px; padding: 16px; min-height: 80px; margin-top: 16px; line-height: 1.6; }
        button { padding: 10px 20px; background: #7c5cff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:disabled { opacity: .5; }
        .note { color: #8a8a93; font-size: 13px; }
        a { color: #9d86ff; }
    </style>
</head>
<body>
    <h1>◆ Chat Dasar Claude</h1>
    <p class="note">Non-streaming · baca <code>response.message.content[0].text</code> · login Puter sekali</p>
    <button id="go">Tanya: What is life?</button>
    <div id="out">Menunggu…</div>
    <p><a href="index.html">← Chat utama</a></p>
    <script>
        const out = document.getElementById('out');
        const go = document.getElementById('go');
        go.onclick = async () => {
            go.disabled = true;
            out.textContent = 'Memanggil Claude…';
            try {
                if (!puter.auth.isSignedIn()) {
                    await puter.auth.signIn();
                }
                // === kode tutorial, persis ===
                const response = await puter.ai.chat("What is life? Answer in 2-3 sentences.", {
                    model: 'claude-sonnet-5-5'
                });
                puter.print(response.message.content[0].text);
                // puter.print menulis ke halaman — baca juga ke box kita:
                out.textContent = response.message.content[0].text;
            } catch (e) {
                out.textContent = 'Error: ' + (e?.message || e?.error || e);
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
