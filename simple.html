<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Dasar</title>
    <link rel="stylesheet" href="features.css">
    <style>:root { --c: #7c5cff; }</style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><circle cx="8.5" cy="10" r="1" fill="currentColor"/><circle cx="12" cy="10" r="1" fill="currentColor"/><circle cx="15.5" cy="10" r="1" fill="currentColor"/></svg>
            </div>
            <div>
                <h1>Chat Dasar <span class="badge">GRATIS</span></h1>
                <p class="note" style="margin:4px 0 0">Streaming real-time per karakter · tanpa login · tanpa API key</p>
            </div>
        </div>

        <div class="card">
            <h2>Quick ask</h2>
            <button id="go">Tanya: What is life?</button>
            <select id="model" style="max-width:220px">
                <option value="openai-fast" selected>openai-fast</option>
                <option value="openai">openai</option>
            </select>
            <div id="out"><span class="cursor"></span></div>
            <div class="meta" id="meta"></div>
        </div>

        <a class="back" href="index.html">← Chat utama</a>
    </div>
    <script>
        const out = document.getElementById('out');
        const go = document.getElementById('go');
        const meta = document.getElementById('meta');

        async function streamAsk(prompt, model) {
            const res = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model,
                    stream: true,
                    messages: [{ role: 'user', content: prompt }],
                }),
            });
            if (!res.ok) {
                if (res.status === 402) throw new Error('Rate limit — tunggu ±45 detik.');
                throw new Error('API ' + res.status);
            }
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = '', full = '', n = 0;
            const paint = () => {
                out.textContent = full;
                const cur = document.createElement('span');
                cur.className = 'cursor';
                out.appendChild(cur);
                meta.textContent = 'real-time · chunks=' + n + ' · chars=' + full.length;
            };
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop() || '';
                for (const line of lines) {
                    const t = line.trim();
                    if (!t.startsWith('data:')) continue;
                    const d = t.slice(5).trim();
                    if (d === '[DONE]') continue;
                    try {
                        const j = JSON.parse(d);
                        if (j.error) throw new Error(j.error.message || 'stream error');
                        const c = j.choices?.[0]?.delta?.content || '';
                        if (c) { full += c; n++; paint(); }
                    } catch (e) {
                        if (e.message && !e.message.includes('JSON')) throw e;
                    }
                }
            }
            if (!full) throw new Error('Respons kosong');
            out.textContent = full;
            meta.textContent = 'Selesai · ' + n + ' chunks real-time';
            return full;
        }

        go.onclick = async () => {
            go.disabled = true;
            out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
            meta.textContent = 'mengalir…';
            try {
                const model = document.getElementById('model').value;
                await streamAsk('What is life? Answer in 2-3 sentences.', model);
            } catch (e) {
                out.textContent = 'Error: ' + (e?.message || e);
                meta.textContent = '';
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
