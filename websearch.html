<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Search + AI</title>
    <link rel="stylesheet" href="features.css">
    <style>
        :root { --c: #34d399; }
        #src { color: var(--muted); font-size: 12px; margin-top: 8px; word-break: break-all; }
        #out { white-space: pre-wrap; min-height: 60px; }
    </style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            </div>
            <div>
                <h1>Web Fetch + AI <span class="badge">GRATIS</span></h1>
                <p class="note" style="margin:4px 0 0">r.jina.ai live fetch · ringkas streaming real-time · tanpa login</p>
            </div>
        </div>

        <div class="card">
            <h2>Baca & ringkas halaman</h2>
            <label>URL yang akan dibaca</label>
            <input id="url" value="https://example.com" />
            <label>Pertanyaan</label>
            <input id="q" value="Summarize this page in 3 sentences." />
            <button id="go">Fetch + Ringkas</button>
            <div id="out"><span class="cursor"></span></div>
            <div class="meta" id="meta"></div>
            <div id="src"></div>
        </div>

        <a class="back" href="index.html">← Kembali</a>
    </div>
    <script>
        const out = document.getElementById('out');
        const src = document.getElementById('src');
        const meta = document.getElementById('meta');
        const go = document.getElementById('go');

        async function streamSummary(messages) {
            const res = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: 'openai-fast', stream: true, messages }),
            });
            if (!res.ok) {
                if (res.status === 402) throw new Error('Rate limit AI — tunggu ±45 detik.');
                throw new Error('AI ' + res.status);
            }
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = '', full = '', n = 0;
            const paint = () => {
                out.textContent = full;
                const cur = document.createElement('span');
                cur.className = 'cursor';
                out.appendChild(cur);
                meta.textContent = 'real-time · chunks=' + n;
            };
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop() || '';
                for (const line of lines) {
                    const t = line.trim();
                    if (!t.startsWith('data:')) continue;
                    const d = t.slice(5).trim();
                    if (d === '[DONE]') continue;
                    try {
                        const j = JSON.parse(d);
                        if (j.error) throw new Error(j.error.message || 'stream error');
                        const c = j.choices?.[0]?.delta?.content || '';
                        if (c) { full += c; n++; paint(); }
                    } catch (e) {
                        if (e.message && !e.message.includes('JSON')) throw e;
                    }
                }
            }
            if (!full) throw new Error('Respons kosong');
            out.textContent = full;
            meta.textContent = 'Selesai · ' + n + ' chunks real-time';
            return full;
        }

        go.onclick = async () => {
            go.disabled = true;
            const url = document.getElementById('url').value.trim();
            const q = document.getElementById('q').value.trim();
            out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
            meta.textContent = 'mengambil halaman…';
            src.textContent = '';
            try {
                const pageRes = await fetch('https://r.jina.ai/' + url);
                if (!pageRes.ok) throw new Error('Fetch gagal: ' + pageRes.status);
                let page = await pageRes.text();
                if (page.length > 6000) page = page.slice(0, 6000) + '\n\n[truncated]';
                src.textContent = 'Sumber: ' + url + ' (' + page.length + ' chars)';
                meta.textContent = 'merangkum real-time…';
                out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
                await streamSummary([
                    { role: 'system', content: 'You summarize web pages accurately and briefly.' },
                    { role: 'user', content: q + '\n\n--- PAGE CONTENT ---\n' + page },
                ]);
            } catch (e) {
                out.textContent = 'Error: ' + e.message;
                meta.textContent = '';
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
