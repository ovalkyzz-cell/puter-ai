<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Search + AI</title>
    <link rel="stylesheet" href="features.css">
    <style>
        :root { --c: #34d399; }
        #src { color: var(--muted); font-size: 12px; margin-top: 8px; word-break: break-all; }
    </style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            </div>
            <div>
                <h1>Web Fetch + AI <span class="badge">GRATIS</span></h1>
                <p class="note" style="margin:4px 0 0">r.jina.ai live fetch · ringkas via Pollinations · tanpa login</p>
            </div>
        </div>

        <div class="card">
            <h2>Baca & ringkas halaman</h2>
            <label>URL yang akan dibaca</label>
            <input id="url" value="https://example.com" />
            <label>Pertanyaan</label>
            <input id="q" value="Summarize this page in 3 sentences." />
            <button id="go">Fetch + Ringkas</button>
            <div id="out">Isi URL lalu klik tombol.</div>
            <div id="src"></div>
        </div>

        <a class="back" href="index.html">← Kembali</a>
    </div>
    <script>
        const out = document.getElementById('out');
        const src = document.getElementById('src');
        const go = document.getElementById('go');
        go.onclick = async () => {
            go.disabled = true;
            const url = document.getElementById('url').value.trim();
            const q = document.getElementById('q').value.trim();
            out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span> Mengambil halaman…';
            src.textContent = '';
            try {
                const pageRes = await fetch('https://r.jina.ai/' + url);
                if (!pageRes.ok) throw new Error('Fetch gagal: ' + pageRes.status);
                let page = await pageRes.text();
                if (page.length > 6000) page = page.slice(0, 6000) + '\n\n[truncated]';
                src.textContent = 'Sumber: ' + url + ' (' + page.length + ' chars)';
                out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span> Merangkum dengan AI…';
                const aiRes = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai-fast',
                        messages: [
                            { role: 'system', content: 'You summarize web pages accurately and briefly.' },
                            { role: 'user', content: q + '\n\n--- PAGE CONTENT ---\n' + page },
                        ],
                    }),
                });
                if (!aiRes.ok) {
                    if (aiRes.status === 402) throw new Error('Rate limit AI — tunggu ±45 detik.');
                    throw new Error('AI ' + aiRes.status);
                }
                const data = await aiRes.json();
                out.textContent = data.choices?.[0]?.message?.content || JSON.stringify(data).slice(0, 400);
            } catch (e) {
                out.textContent = 'Error: ' + e.message;
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
