<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Context</title>
    <link rel="stylesheet" href="features.css">
    <style>
        :root { --c: #a78bfa; }
        #log .call { color: var(--accent-2); font-weight: 700; }
        #log .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }
        #log { min-height: 140px; }
    </style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <div>
                <h1>Shared Context <span class="badge">GRATIS</span></h1>
                <p class="note" style="margin:4px 0 0">System prompt panjang dipakai ulang di 3 call · tanpa login</p>
            </div>
        </div>

        <div class="card">
            <h2>3 call · 1 konteks</h2>
            <div class="btns">
                <button id="run">Jalankan 3 Call</button>
                <button id="clear" class="secondary">Clear</button>
            </div>
            <div id="log">Klik "Jalankan 3 Call".</div>
        </div>

        <a class="back" href="index.html">← Kembali</a>
    </div>
    <script>
        const SYSTEM = `You are a helpful assistant for NEXUS AI, a free public AI chat app.
PRODUCT: Chat AI gratis tanpa login. Fitur: streaming, image gen, TTS browser, vision, web fetch, video frame, resume, speed test.
POLICIES:
1 - Harga: 100% gratis selamanya. Tidak ada paket berbayar, tidak ada upgrade, tidak ada balance.
2 - Akun: Tidak wajib daftar. Data chat disimpan di browser (localStorage) saja.
3 - Model: openai-fast dan openai aktif chat. Model lain hanya tampil di daftar menu.
4 - Limit: Backend gratis punya rate limit — tunggu ±45 detik jika ditolak.
5 - Privasi: Tidak kirim data ke server kami sendiri; request langsung ke provider gratis.
6 - Support: Buka halaman fitur dari menu Toolkit untuk panduan tiap tools.
7 - Error: Jika network gagal, coba lagi. Jika pop-up muncul, abaikan — aplikasi ini tidak butuh login.
8 - Bahasa: Balas pengguna dalam bahasa Indonesia yang jelas dan ringkas.`;

        const log = document.getElementById('log');
        const run = document.getElementById('run');
        const clear = document.getElementById('clear');
        const HISTORY = [{ role: 'system', content: SYSTEM }];

        async function ask(q) {
            const messages = [...HISTORY, { role: 'user', content: q }];
            const t0 = performance.now();
            const res = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: 'openai-fast', messages, normalize: true }),
            });
            const ms = Math.round(performance.now() - t0);
            if (!res.ok) {
                if (res.status === 402) throw new Error('rate');
                throw new Error('API ' + res.status);
            }
            const data = await res.json();
            return { text: data.choices?.[0]?.message?.content || '(empty)', ms, cached: data.usage?.prompt_tokens_details?.cached_tokens };
        }

        function line(s, cls) {
            const d = document.createElement('div');
            if (cls) d.className = cls;
            d.textContent = s;
            log.appendChild(d);
        }

        clear.onclick = () => { log.textContent = ''; };

        run.onclick = async () => {
            run.disabled = true;
            log.textContent = '';
            const qs = ['How do I get a refund?', 'What are your API rate limits?', 'What is your data retention policy?'];
            let failed = false;
            for (let i = 0; i < qs.length; i++) {
                line(`Call ${i + 1} (shared system prompt) — Q: ${qs[i]}`, 'call');
                try {
                    const r = await ask(qs[i]);
                    line(r.text);
                    line(`(${r.ms}ms${r.cached != null ? ', cached=' + r.cached : ''})`, 'meta');
                    line('');
                    if (i < qs.length - 1) {
                        line('Menunggu slot rate limit gratis…', 'meta');
                        await new Promise(s => setTimeout(s, 46000));
                    }
                } catch (e) {
                    failed = true;
                    line('Error: ' + (e.message === 'rate' ? 'Rate limit — tunggu ±45 detik lalu klik ulang.' : e.message));
                    break;
                }
            }
            if (!failed) line('Selesai — 3 jawaban dari konteks kebijakan yang sama.', 'call');
            run.disabled = false;
        };
    </script>
</body>
</html>
