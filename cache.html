<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Caching — Tanpa Login</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; background: #0b0b0d; color: #e8e8ea; }
        h1 { font-size: 22px; }
        .note { color: #8a8a93; font-size: 13px; }
        button { padding: 10px 16px; background: #7c5cff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin: 4px 4px 4px 0; }
        button:disabled { opacity: .5; }
        #log { background: #1a1a1f; border: 1px solid #26262d; border-radius: 12px; padding: 16px; min-height: 120px; margin-top: 12px; white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
        a { color: #9d86ff; }
        .call { color: #9d86ff; font-weight: 600; }
        .meta { color: #8a8a93; font-size: 12px; }
    </style>
</head>
<body>
    <h1>◆ Shared System Context (3 Calls)</h1>
    <p class="note">Tanpa login · System prompt panjang dipakai ulang di 3 pertanyaan — model tetap paham kebijakan Acme. (Pollinations gratis tidak mengekspos cache_control, tapi konteks bersama tetap jalan.)</p>
    <button id="run">Jalankan 3 Call</button>
    <button id="clear" style="background:#2a2a33">Clear</button>
    <div id="log">Klik "Jalankan 3 Call".</div>
    <p><a href="index.html">← Kembali</a></p>
    <script>
        const SYSTEM = `You are an expert customer support agent for Acme Corporation.
COMPANY: Founded 2010, HQ San Francisco. 50,000+ customers, 120 countries. Products: AcmeCloud, AcmeBrain, AcmeFlow, AcmeShield.
POLICIES:
1 - Tiers: Starter $29/mo (10GB, email support), Professional $79/mo (100GB, priority+chat), Enterprise $149/mo (1TB, 24/7 phone, account manager), Ultimate $299/mo (unlimited, custom SLA).
2 - Refund: 30-day money-back. After 30 days prorated. Annual 20% discount; refunds after 30 days at monthly rate.
3 - Data Retention: subscription + 90 days after cancel, then deleted. Backups: 30d Starter/Pro, 90d Enterprise, 365d Ultimate. Export anytime.
4 - SLA: Starter 99.5%, Pro 99.9%, Enterprise 99.95%, Ultimate 99.99%. Credits = 10x downtime on next bill. Maintenance excluded, announced 72h ahead.
5 - Security: SOC 2, GDPR, TLS 1.3 all tiers. Enterprise+ also HIPAA, FedRAMP (in progress), custom residency. 2FA mandatory Enterprise+. SSO SAML/OIDC on Pro+.
6 - API Limits: Starter 100 rpm, Pro 1k rpm, Enterprise 10k rpm, Ultimate 100k rpm (burst 500k).
7 - Support L1: 24h Starter / 4h Pro / 1h Ent / 15m Ult. L2: 8h Pro / 2h Ent / 30m Ult. L3: 4h Ent / 1h Ult.
8 - Account Mgmt: Enterprise+ get dedicated CSM, quarterly reviews, 9-6 local hours, 24/7 hotline for urgent.`;

        const log = document.getElementById('log');
        const run = document.getElementById('run');
        const clear = document.getElementById('clear');
        const HISTORY = [{ role: 'system', content: SYSTEM }];

        async function ask(q) {
            const messages = [...HISTORY, { role: 'user', content: q }];
            const t0 = performance.now();
            const res = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: 'openai-fast', messages, normalize: true }),
            });
            const ms = Math.round(performance.now() - t0);
            if (!res.ok) {
                const t = await res.text();
                if (res.status === 402) throw new Error('rate');
                throw new Error('API ' + res.status + ': ' + t.slice(0, 120));
            }
            const data = await res.json();
            return { text: data.choices?.[0]?.message?.content || '(empty)', ms, cached: data.usage?.prompt_tokens_details?.cached_tokens };
        }

        function line(s, cls) {
            const d = document.createElement('div');
            if (cls) d.className = cls;
            d.textContent = s;
            log.appendChild(d);
        }

        clear.onclick = () => { log.textContent = ''; };

        run.onclick = async () => {
            run.disabled = true;
            log.textContent = '';
            const qs = [
                'How do I get a refund?',
                'What are your API rate limits?',
                'What is your data retention policy?',
            ];
            let failed = false;
            for (let i = 0; i < qs.length; i++) {
                line(`Call ${i + 1} (shared system prompt) — Q: ${qs[i]}`, 'call');
                try {
                    const r = await ask(qs[i]);
                    line(r.text);
                    line(`(${r.ms}ms${r.cached != null ? ', cached_tokens=' + r.cached : ''})`, 'meta');
                    line('');
                    if (i < qs.length - 1) {
                        line('Menunggu slot rate limit gratis…', 'meta');
                        await new Promise(s => setTimeout(s, 46000));
                    }
                } catch (e) {
                    failed = true;
                    line('Error: ' + (e.message === 'rate' ? 'Rate limit — tunggu ±45 detik lalu klik ulang.' : e.message));
                    break;
                }
            }
            if (!failed) line('Selesai — 3 jawaban dari konteks kebijakan yang sama.', 'call');
            run.disabled = false;
        };
    </script>
</body>
</html>
