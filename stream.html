<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Real-time</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; background: #0b0b0d; color: #e8e8ea; }
        h1 { font-size: 22px; }
        .note { color: #8a8a93; font-size: 13px; }
        button { padding: 10px 20px; background: #7c5cff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:disabled { opacity: .5; }
        select { padding: 8px 10px; background: #1a1a1f; color: #e8e8ea; border: 1px solid #26262d; border-radius: 8px; margin-left: 8px; }
        #out { white-space: pre-wrap; background: #1a1a1f; border: 1px solid #26262d; border-radius: 12px; padding: 16px; min-height: 120px; margin-top: 16px; line-height: 1.6; }
        .cursor { display: inline-block; width: 7px; height: 15px; background: #7c5cff; animation: b 1s steps(1) infinite; }
        @keyframes b { 50% { opacity: 0; } }
        .meta { color: #8a8a93; font-size: 12px; margin-top: 8px; }
        a { color: #9d86ff; }
    </style>
</head>
<body>
    <h1>◆ Streaming Real-time</h1>
    <p class="note">Tanpa login (openai-fast) · Claude opsional kalau sudah login</p>
    <button id="go">Stream sekarang</button>
    <select id="model">
        <option value="openai-fast" selected>openai-fast (tanpa login)</option>
        <option value="claude-sonnet-5-5">claude-sonnet-5-5 (login)</option>
        <option value="claude-fable-5-2">claude-fable-5-2 (login)</option>
    </select>
    <div id="out"><span class="cursor"></span></div>
    <div class="meta" id="meta"></div>
    <p><a href="index.html">← Chat utama</a></p>
    <script>
        const out = document.getElementById('out');
        const go = document.getElementById('go');
        const meta = document.getElementById('meta');
        const modelSel = document.getElementById('model');

        async function streamFree(prompt, model) {
            const res = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model, stream: true, messages: [{ role: 'user', content: prompt }] }),
            });
            if (!res.ok) {
                const t = await res.text();
                if (res.status === 402) throw new Error('Rate limit — tunggu ±45 detik.');
                throw new Error('API ' + res.status);
            }
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = '', full = '', n = 0;
            const onChunk = () => {
                out.textContent = full;
                const cur = document.createElement('span');
                cur.className = 'cursor';
                out.appendChild(cur);
                meta.textContent = 'chunks=' + n;
            };
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop() || '';
                for (const line of lines) {
                    if (!line.trim().startsWith('data:')) continue;
                    const d = line.trim().slice(5).trim();
                    if (d === '[DONE]') continue;
                    try {
                        const j = JSON.parse(d);
                        const c = j.choices?.[0]?.delta?.content || '';
                        if (c) { full += c; n++; onChunk(); }
                    } catch {}
                }
            }
            return { full, n };
        }

        async function streamClaude(prompt, model) {
            // pola tutorial: stream + for await + part?.text
            const response = await puter.ai.chat(prompt, { model, stream: true });
            let full = '', n = 0;
            for await (const part of response) {
                const t = part?.text;
                if (t) {
                    full += t;
                    n++;
                    out.textContent = full;
                    const cur = document.createElement('span');
                    cur.className = 'cursor';
                    out.appendChild(cur);
                    meta.textContent = 'chunks=' + n;
                }
            }
            return { full, n };
        }

        go.onclick = async () => {
            go.disabled = true;
            out.innerHTML = '<span class="cursor"></span>';
            const model = modelSel.value;
            const useClaude = model.startsWith('claude-');
            meta.textContent = 'memulai…';
            const t0 = performance.now();
            try {
                const prompt = 'Write a detailed essay on the impact of artificial intelligence on society (3 short paragraphs).';
                if (useClaude) {
                    if (!puter.auth.isSignedIn()) await puter.auth.signIn();
                    var r = await streamClaude(prompt, model);
                } else {
                    var r = await streamFree(prompt, model);
                }
                if (!r.full) throw new Error('Respons kosong');
                meta.textContent = 'Selesai · ' + r.n + ' chunks · ' + ((performance.now() - t0) / 1000).toFixed(1) + 's · ' + model;
            } catch (e) {
                out.textContent = 'Error: ' + (e?.message || e?.error || e);
                meta.textContent = '';
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
