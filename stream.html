<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Real-time</title>
    <link rel="stylesheet" href="features.css">
    <style>:root { --c: #38bdf8; }</style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <div>
                <h1>Streaming Real-time <span class="badge">GRATIS</span></h1>
                <p class="note" style="margin:4px 0 0">Ketikan AI mengalir per karakter · tanpa login</p>
            </div>
        </div>

        <div class="card">
            <h2>Live stream</h2>
            <div class="btns" style="margin-bottom:12px">
                <button id="go">Stream sekarang</button>
                <select id="model" style="max-width:200px;margin-bottom:0">
                    <option value="openai-fast" selected>openai-fast</option>
                    <option value="openai">openai</option>
                </select>
            </div>
            <div id="out"><span class="cursor"></span></div>
            <div class="meta" id="meta"></div>
        </div>

        <a class="back" href="index.html">← Chat utama</a>
    </div>
    <script>
        const out = document.getElementById('out');
        const go = document.getElementById('go');
        const meta = document.getElementById('meta');
        const modelSel = document.getElementById('model');

        async function streamFree(prompt, model) {
            const res = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model, stream: true, messages: [{ role: 'user', content: prompt }] }),
            });
            if (!res.ok) {
                if (res.status === 402) throw new Error('Rate limit — tunggu ±45 detik.');
                throw new Error('API ' + res.status);
            }
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = '', full = '', n = 0;
            const paint = () => {
                out.textContent = full;
                const cur = document.createElement('span');
                cur.className = 'cursor';
                out.appendChild(cur);
                meta.textContent = 'chunks=' + n;
            };
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop() || '';
                for (const line of lines) {
                    if (!line.trim().startsWith('data:')) continue;
                    const d = line.trim().slice(5).trim();
                    if (d === '[DONE]') continue;
                    try {
                        const j = JSON.parse(d);
                        const c = j.choices?.[0]?.delta?.content || '';
                        if (c) { full += c; n++; paint(); }
                    } catch {}
                }
            }
            return { full, n };
        }

        go.onclick = async () => {
            go.disabled = true;
            out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
            const model = modelSel.value;
            meta.textContent = 'memulai…';
            const t0 = performance.now();
            try {
                const prompt = 'Write a short essay on AI in 2 paragraphs.';
                const r = await streamFree(prompt, model);
                if (!r.full) throw new Error('Respons kosong');
                out.textContent = r.full;
                meta.textContent = 'Selesai · ' + r.n + ' chunks · ' + ((performance.now() - t0) / 1000).toFixed(1) + 's · ' + model;
            } catch (e) {
                out.textContent = 'Error: ' + (e?.message || e?.error || e);
                meta.textContent = '';
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
