<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Chat — Tanpa Login</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; background: #0b0b0d; color: #e8e8ea; }
        h1 { font-size: 22px; }
        #out { white-space: pre-wrap; background: #1a1a1f; border: 1px solid #26262d; border-radius: 12px; padding: 16px; min-height: 100px; line-height: 1.6; }
        .cursor { display: inline-block; width: 7px; height: 15px; background: #7c5cff; animation: b 1s steps(1) infinite; }
        @keyframes b { 50% { opacity: 0; } }
        button { padding: 10px 20px; background: #7c5cff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:disabled { opacity: .5; }
        .note { color: #8a8a93; font-size: 13px; }
        a { color: #9d86ff; }
        #meta { color: #8a8a93; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>◆ Streaming Response (real-time)</h1>
    <p class="note">Tanpa login · SSE stream dari Pollinations · teks muncul kata per kata</p>
    <button id="go">Stream: Rick and Morty</button>
    <div id="out"><span class="cursor"></span></div>
    <div id="meta"></div>
    <p><a href="index.html">← Kembali</a></p>
    <script>
        const out = document.getElementById('out');
        const go = document.getElementById('go');
        const meta = document.getElementById('meta');

        go.onclick = async () => {
            go.disabled = true;
            out.innerHTML = '<span class="cursor"></span>';
            meta.textContent = 'streaming…';
            const t0 = performance.now();
            let full = '';
            let chunks = 0;
            try {
                const res = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai-fast',
                        stream: true,
                        messages: [{
                            role: 'user',
                            content: 'Tell me in detail what Rick and Morty is all about. 3 short paragraphs.',
                        }],
                    }),
                });
                if (!res.ok) {
                    const t = await res.text();
                    if (res.status === 402) throw new Error('Rate limit — tunggu ±45 detik.');
                    throw new Error('API ' + res.status + ': ' + t.slice(0, 150));
                }
                const reader = res.body.getReader();
                const dec = new TextDecoder();
                let buf = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += dec.decode(value, { stream: true });
                    const lines = buf.split('\n');
                    buf = lines.pop() || '';
                    for (const line of lines) {
                        const t = line.trim();
                        if (!t.startsWith('data:')) continue;
                        const data = t.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const j = JSON.parse(data);
                            const c = j.choices?.[0]?.delta?.content || '';
                            if (c) {
                                full += c;
                                chunks++;
                                out.textContent = full;
                                const cur = document.createElement('span');
                                cur.className = 'cursor';
                                out.appendChild(cur);
                                meta.textContent = `chunks=${chunks} · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
                            }
                        } catch {}
                    }
                }
                if (!full) throw new Error('Respons kosong');
                meta.textContent = `Selesai · ${chunks} chunks · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
            } catch (e) {
                out.textContent = 'Error: ' + e.message;
                meta.textContent = '';
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
