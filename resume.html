<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer — Tanpa Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #0b0b0d; color: #e8e8ea; }
        .container { border: 1px solid #26262d; padding: 20px; border-radius: 12px; background: #121215; }
        h1 { font-size: 22px; }
        p.note { color: #8a8a93; font-size: 13px; }
        .upload-area { border: 2px dashed #3a3a44; padding: 40px; text-align: center; margin: 20px 0; border-radius: 8px; cursor: pointer; transition: border-color .3s; }
        .upload-area:hover, .upload-area.dragover { border-color: #7c5cff; background: #1a1a1f; }
        input[type=file] { display: none; }
        button { width: 100%; padding: 12px; background: #7c5cff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: 600; }
        button:disabled { background: #2a2a33; color: #666; cursor: not-allowed; }
        #response { margin-top: 20px; padding: 15px; background: #1a1a1f; border-radius: 8px; display: none; white-space: pre-wrap; line-height: 1.6; border: 1px solid #26262d; }
        .file-name { margin-top: 10px; font-style: italic; color: #8a8a93; }
        a { color: #9d86ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resume Analyzer</h1>
        <p class="note">Tanpa login · Upload <b>.txt / .md</b> (PDF/DOC tidak dibaca browser tanpa library) → analisis AI</p>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <p>Klik atau drop file resume (TXT/MD)</p>
            <input type="file" id="fileInput" accept=".txt,.md,.text" />
        </div>

        <div class="file-name" id="fileName" style="display:none;"></div>
        <button id="analyzeBtn" disabled>Analyze My Resume</button>
        <div id="response"></div>
        <p><a href="index.html">← Kembali</a></p>
    </div>

    <script>
        let uploadedText = null;
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.querySelector('.upload-area');
        const fileName = document.getElementById('fileName');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const response = document.getElementById('response');

        function setFile(file) {
            if (!file) return;
            if (!/\.(txt|md|text)$/i.test(file.name)) {
                fileName.textContent = 'Hanya .txt / .md yang didukung di sini';
                fileName.style.display = 'block';
                analyzeBtn.disabled = true;
                return;
            }
            fileName.textContent = 'Selected: ' + file.name;
            fileName.style.display = 'block';
            const reader = new FileReader();
            reader.onload = () => {
                uploadedText = String(reader.result || '').slice(0, 8000);
                analyzeBtn.disabled = !uploadedText;
            };
            reader.readAsText(file);
        }

        fileInput.onchange = e => setFile(e.target.files[0]);
        uploadArea.ondragover = e => { e.preventDefault(); uploadArea.classList.add('dragover'); };
        uploadArea.ondragleave = () => uploadArea.classList.remove('dragover');
        uploadArea.ondrop = e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            setFile(e.dataTransfer.files[0]);
        };

        analyzeBtn.onclick = async () => {
            if (!uploadedText) return;
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = 'Analyzing...';
            response.style.display = 'none';
            try {
                const res = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai-fast',
                        stream: true,
                        messages: [{
                            role: 'user',
                            content: 'Please analyze this resume and suggest how to improve it. Only a few sentences are needed.\n\n--- RESUME ---\n' + uploadedText,
                        }],
                    }),
                });
                if (!res.ok) {
                    const t = await res.text();
                    if (res.status === 402) throw new Error('Rate limit — tunggu ±45 detik lalu coba lagi.');
                    throw new Error('API ' + res.status + ': ' + t.slice(0, 150));
                }
                response.style.display = 'block';
                const reader = res.body.getReader();
                const dec = new TextDecoder();
                let buf = '', full = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += dec.decode(value, { stream: true });
                    const lines = buf.split('\n');
                    buf = lines.pop() || '';
                    for (const line of lines) {
                        const t = line.trim();
                        if (!t.startsWith('data:')) continue;
                        const data = t.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const j = JSON.parse(data);
                            const c = j.choices?.[0]?.delta?.content || '';
                            if (c) { full += c; response.textContent = full; }
                        } catch {}
                    }
                }
                if (!full) throw new Error('Respons kosong');
            } catch (error) {
                response.style.display = 'block';
                response.textContent = 'Error: ' + error.message;
            }
            analyzeBtn.disabled = false;
            analyzeBtn.textContent = 'Analyze My Resume';
        };
    </script>
</body>
</html>
