<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer</title>
    <link rel="stylesheet" href="features.css">
    <style>
        :root { --c: #5eead4; }
        .upload-area {
            border: 2px dashed rgba(94, 234, 212, .35);
            padding: 40px;
            text-align: center;
            margin: 12px 0;
            border-radius: 14px;
            cursor: pointer;
            transition: all .3s ease;
            background: rgba(94, 234, 212, .03);
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #5eead4;
            background: rgba(94, 234, 212, .08);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(94, 234, 212, .12);
        }
        input[type=file] { display: none; }
        .file-name { margin-top: 8px; font-style: italic; color: var(--muted); font-size: 13px; }
        #response { display: none; }
        #response.show { display: block; animation: pageIn .4s ease both; }
    </style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
            </div>
            <div>
                <h1>Resume Analyzer <span class="badge">GRATIS</span></h1>
                <p class="note" style="margin:4px 0 0">Upload <b>.txt / .md</b> → analisis AI · tanpa login</p>
            </div>
        </div>

        <div class="card">
            <h2>Upload resume</h2>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p>Klik atau drop file resume (TXT/MD)</p>
                <input type="file" id="fileInput" accept=".txt,.md,.text" />
            </div>
            <div class="file-name" id="fileName" style="display:none;"></div>
            <button id="analyzeBtn" disabled>Analyze My Resume</button>
            <div id="response" class="out"></div>
        </div>

        <a class="back" href="index.html">← Kembali</a>
    </div>
    <script>
        let uploadedText = null;
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.querySelector('.upload-area');
        const fileName = document.getElementById('fileName');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const response = document.getElementById('response');

        function setFile(file) {
            if (!file) return;
            if (!/\.(txt|md|text)$/i.test(file.name)) {
                fileName.textContent = 'Hanya .txt / .md yang didukung di sini';
                fileName.style.display = 'block';
                analyzeBtn.disabled = true;
                return;
            }
            fileName.textContent = 'Selected: ' + file.name;
            fileName.style.display = 'block';
            const reader = new FileReader();
            reader.onload = () => {
                uploadedText = String(reader.result || '').slice(0, 8000);
                analyzeBtn.disabled = !uploadedText;
            };
            reader.readAsText(file);
        }

        fileInput.onchange = e => setFile(e.target.files[0]);
        uploadArea.ondragover = e => { e.preventDefault(); uploadArea.classList.add('dragover'); };
        uploadArea.ondragleave = () => uploadArea.classList.remove('dragover');
        uploadArea.ondrop = e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            setFile(e.dataTransfer.files[0]);
        };

        analyzeBtn.onclick = async () => {
            if (!uploadedText) return;
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = 'Analyzing...';
            response.classList.remove('show');
            response.style.display = 'none';
            try {
                const res = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai-fast',
                        stream: true,
                        messages: [{
                            role: 'user',
                            content: 'Please analyze this resume and suggest how to improve it. Only a few sentences are needed.\n\n--- RESUME ---\n' + uploadedText,
                        }],
                    }),
                });
                if (!res.ok) {
                    if (res.status === 402) throw new Error('Rate limit — tunggu ±45 detik lalu coba lagi.');
                    throw new Error('API ' + res.status);
                }
                response.style.display = 'block';
                response.classList.add('show');
                response.innerHTML = '<span class="cursor"></span>';
                const reader = res.body.getReader();
                const dec = new TextDecoder();
                let buf = '', full = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += dec.decode(value, { stream: true });
                    const lines = buf.split('\n');
                    buf = lines.pop() || '';
                    for (const line of lines) {
                        const t = line.trim();
                        if (!t.startsWith('data:')) continue;
                        const data = t.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const j = JSON.parse(data);
                            const c = j.choices?.[0]?.delta?.content || '';
                            if (c) { full += c; response.textContent = full; }
                        } catch {}
                    }
                }
                if (!full) throw new Error('Respons kosong');
            } catch (error) {
                response.style.display = 'block';
                response.classList.add('show');
                response.textContent = 'Error: ' + error.message;
            }
            analyzeBtn.disabled = false;
            analyzeBtn.textContent = 'Analyze My Resume';
        };
    </script>
</body>
</html>
