<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gen — Gratis Tanpa Login</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; background: #0b0b0d; color: #e8e8ea; }
        h1 { font-size: 22px; }
        .note { color: #8a8a93; font-size: 13px; }
        .note b { color: #9d86ff; }
        input, select { width: 100%; padding: 10px 12px; background: #1a1a1f; border: 1px solid #26262d; border-radius: 8px; color: #e8e8ea; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #7c5cff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-right: 8px; margin-bottom: 8px; }
        button:disabled { opacity: .5; }
        .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
        .card { flex: 1; min-width: 280px; }
        .card h3 { font-size: 14px; color: #9d86ff; margin-bottom: 8px; }
        .card img { width: 100%; border-radius: 12px; border: 1px solid #26262d; min-height: 120px; background: #1a1a1f; }
        #status { color: #8a8a93; font-size: 13px; margin-top: 10px; }
        a { color: #9d86ff; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .badge { display: inline-block; background: #1f6f43; color: #b8f5d4; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 700; margin-left: 8px; }
        @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>◆ Generate + Edit Gambar <span class="badge">GRATIS · TANPA LOGIN</span></h1>
    <p class="note">
        <b>image.pollinations.ai</b> — tanpa API key, tanpa balance, tanpa daftar.
        Satu gambar per ±45 detik (limit tier gratis).
    </p>

    <label>Prompt gambar:</label>
    <input id="p1" value="A simple infographic about photosynthesis, clean flat design" />

    <div class="grid2">
        <div>
            <label>Ukuran</label>
            <select id="size">
                <option value="768" selected>768 × 768</option>
                <option value="1024">1024 × 1024</option>
                <option value="1280x720">1280 × 720 (landscape)</option>
                <option value="720x1280">720 × 1280 (portrait)</option>
            </select>
        </div>
        <div>
            <label>Seed (kosongkan = acak)</label>
            <input id="seed" placeholder="mis. 42" />
        </div>
    </div>

    <label>Edit prompt (opsional):</label>
    <input id="p2" value="Translate all text in this image to Spanish. Keep everything else the same." />

    <button id="gen">1. Generate</button>
    <button id="edit" disabled>2. Edit / varian</button>
    <div id="status">Langkah 1 dulu.</div>
    <div class="row">
        <div class="card"><h3>Hasil generate</h3><img id="img1" alt="generated" /></div>
        <div class="card"><h3>Hasil edit</h3><img id="img2" alt="edited" /></div>
    </div>
    <p><a href="index.html">← Kembali</a></p>
    <script>
        const img1 = document.getElementById('img1');
        const img2 = document.getElementById('img2');
        const status = document.getElementById('status');
        const gen = document.getElementById('gen');
        const edit = document.getElementById('edit');
        let url1 = '';

        function sizeParts() {
            const v = document.getElementById('size').value;
            if (v.includes('x')) {
                const [w, h] = v.split('x');
                return { w: +w, h: +h };
            }
            return { w: +v, h: +v };
        }

        function imageUrl(prompt, seed) {
            const p = encodeURIComponent(prompt);
            const { w, h } = sizeParts();
            const s = seed || (Date.now() % 100000);
            return `https://image.pollinations.ai/prompt/${p}?width=${w}&height=${h}&seed=${s}&nologo=true`;
        }

        function loadImage(url) {
            return new Promise((res, rej) => {
                const im = new Image();
                im.onload = () => res(im);
                im.onerror = () => rej(new Error('Gagal muat gambar'));
                im.src = url;
            });
        }

        gen.onclick = async () => {
            gen.disabled = true;
            status.textContent = 'Generate… (bisa 10–30 detik, gratis tanpa login)';
            try {
                const seed = document.getElementById('seed').value || (Date.now() % 100000);
                url1 = imageUrl(document.getElementById('p1').value, seed);
                await loadImage(url1);
                img1.src = url1;
                status.textContent = 'Generate OK ✓ Tunggu ±45 detik sebelum langkah 2 (limit gratis).';
                edit.disabled = false;
                setTimeout(() => { status.textContent = 'Slot edit siap — klik tombol 2.'; }, 46000);
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
            } finally {
                gen.disabled = false;
            }
        };

        edit.onclick = async () => {
            edit.disabled = true;
            status.textContent = 'Membuat varian/edit…';
            try {
                const p2 = document.getElementById('p2').value + ' | based on: ' + document.getElementById('p1').value;
                const seed = (Date.now() % 100000) + 7;
                const url = imageUrl(p2, seed);
                await loadImage(url);
                img2.src = url;
                status.textContent = 'Selesai ✓ Catatan: tier gratis = text-to-image (bukan image-to-image penuh).';
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
            } finally {
                edit.disabled = false;
            }
        };
    </script>
</body>
</html>
