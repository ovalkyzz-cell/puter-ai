<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gen — Gratis</title>
    <link rel="stylesheet" href="features.css">
    <style>
        :root { --c: #fb923c; }
        .preview-wrap { position: relative; }
        .bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; margin-top: 8px; }
        .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #fb923c, #f97316); transition: width .2s ease; }
    </style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </div>
            <div>
                <h1>Image Gen <span class="badge">GRATIS · TANPA LOGIN</span></h1>
                <p class="note" style="margin:4px 0 0">image.pollinations.ai · progres live real-time · tanpa API key</p>
            </div>
        </div>

        <div class="card">
            <h2>Prompt</h2>
            <label>Prompt gambar</label>
            <input id="p1" value="A simple infographic about photosynthesis, clean flat design" />
            <div class="grid2">
                <div>
                    <label>Ukuran</label>
                    <select id="size">
                        <option value="768" selected>768 × 768</option>
                        <option value="1024">1024 × 1024</option>
                        <option value="1280x720">1280 × 720 (landscape)</option>
                        <option value="720x1280">720 × 1280 (portrait)</option>
                    </select>
                </div>
                <div>
                    <label>Seed (kosong = acak)</label>
                    <input id="seed" placeholder="mis. 42" />
                </div>
            </div>
            <label>Edit prompt (opsional)</label>
            <input id="p2" value="Translate all text in this image to Spanish. Keep everything else the same." />
            <div class="btns" style="margin-top:6px">
                <button id="gen">1. Generate</button>
                <button id="edit" class="secondary" disabled>2. Edit / varian</button>
            </div>
            <div id="status">Langkah 1 dulu.</div>
            <div class="bar" id="bar1" hidden><i></i></div>
            <div class="bar" id="bar2" hidden><i></i></div>
        </div>

        <div class="row">
            <div class="card preview-wrap"><h3>Hasil generate</h3><img id="img1" class="preview" alt="generated" /><div class="meta" id="m1"></div></div>
            <div class="card preview-wrap"><h3>Hasil edit</h3><img id="img2" class="preview" alt="edited" /><div class="meta" id="m2"></div></div>
        </div>

        <a class="back" href="index.html">← Kembali</a>
    </div>
    <script>
        const img1 = document.getElementById('img1');
        const img2 = document.getElementById('img2');
        const status = document.getElementById('status');
        const gen = document.getElementById('gen');
        const edit = document.getElementById('edit');
        const bar1 = document.getElementById('bar1');
        const bar2 = document.getElementById('bar2');
        const m1 = document.getElementById('m1');
        const m2 = document.getElementById('m2');

        function sizeParts() {
            const v = document.getElementById('size').value;
            if (v.includes('x')) { const [w, h] = v.split('x'); return { w: +w, h: +h }; }
            return { w: +v, h: +v };
        }

        function imageUrl(prompt, seed) {
            const p = encodeURIComponent(prompt);
            const { w, h } = sizeParts();
            const s = seed || (Date.now() % 100000);
            return `https://image.pollinations.ai/prompt/${p}?width=${w}&height=${h}&seed=${s}&nologo=true`;
        }

        async function fetchImageRealtime(url, bar, statusEl, metaEl) {
            bar.hidden = false;
            const fill = bar.querySelector('i');
            fill.style.width = '0%';
            const t0 = performance.now();
            let loaded = 0;
            let total = 0;
            let firstByte = null;

            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const len = res.headers.get('content-length');
            total = len ? parseInt(len, 10) : 0;

            const reader = res.body.getReader();
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                if (firstByte == null) firstByte = Math.round(performance.now() - t0);
                loaded += value.length;
                chunks.push(value);
                if (total) {
                    const pct = Math.min(100, Math.round((loaded / total) * 100));
                    fill.style.width = pct + '%';
                    statusEl.textContent = `real-time · ${pct}% · ${loaded} bytes · first ${firstByte}ms`;
                } else {
                    fill.style.width = Math.min(95, Math.round((loaded / 100000) * 100)) + '%';
                    statusEl.textContent = `real-time · ${loaded} bytes · first ${firstByte || 0}ms`;
                }
            }
            fill.style.width = '100%';
            const blob = new Blob(chunks, { type: res.headers.get('content-type') || 'image/jpeg' });
            const objUrl = URL.createObjectURL(blob);
            await new Promise((res, rej) => {
                const im = new Image();
                im.onload = res;
                im.onerror = () => rej(new Error('Gagal decode gambar'));
                im.src = objUrl;
            });
            const ms = Math.round(performance.now() - t0);
            metaEl.textContent = `${(blob.size / 1024).toFixed(1)} KB · ${ms}ms real-time`;
            statusEl.textContent = `Generate OK ✓ ${ms}ms · progres live selesai.`;
            return objUrl;
        }

        gen.onclick = async () => {
            gen.disabled = true;
            status.textContent = 'Generate… (streaming byte real-time, gratis tanpa login)';
            try {
                const seed = document.getElementById('seed').value || (Date.now() % 100000);
                const url1 = imageUrl(document.getElementById('p1').value, seed);
                const obj = await fetchImageRealtime(url1, bar1, status, m1);
                img1.src = obj;
                edit.disabled = false;
                setTimeout(() => { status.textContent = 'Slot edit siap — klik tombol 2.'; }, 46000);
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
            } finally {
                gen.disabled = false;
            }
        };

        edit.onclick = async () => {
            edit.disabled = true;
            status.textContent = 'Membuat varian/edit… real-time';
            try {
                const p2 = document.getElementById('p2').value + ' | based on: ' + document.getElementById('p1').value;
                const seed = (Date.now() % 100000) + 7;
                const url = imageUrl(p2, seed);
                const obj = await fetchImageRealtime(url, bar2, status, m2);
                img2.src = obj;
                status.textContent = 'Selesai ✓ progres byte real-time.';
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
            } finally {
                edit.disabled = false;
            }
        };
    </script>
</body>
</html>
