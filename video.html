<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Frame AI</title>
    <link rel="stylesheet" href="features.css">
    <style>
        :root { --c: #fbbf24; }
        video { max-width: 100%; border-radius: 12px; display: block; margin: 8px 0; border: 1px solid var(--border); }
        canvas { max-width: 100%; border-radius: 12px; border: 1px solid var(--border); margin-top: 8px; display: none; animation: imgIn .4s ease both; }
        #out { white-space: pre-wrap; min-height: 48px; }
    </style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M17 9h5M2 15h5M17 15h5"/></svg>
            </div>
            <div>
                <h1>Video Frame AI <span class="badge">GRATIS</span></h1>
                <p class="note" style="margin:4px 0 0">Ekstrak 1 frame → AI deskripsikan real-time · tanpa login</p>
            </div>
        </div>

        <div class="card">
            <h2>Sumber video</h2>
            <video id="vid" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" controls crossorigin="anonymous"></video>
            <canvas id="cv" width="640" height="360"></canvas>
            <button id="go">Analisis Frame Video</button>
            <div class="meta" id="meta"></div>
            <div id="out">Klik tombol — frame detik ke-1 akan diekstrak lalu dianalisis AI real-time.</div>
        </div>

        <a class="back" href="index.html">← Kembali</a>
    </div>
    <script>
        const vid = document.getElementById('vid');
        const cv = document.getElementById('cv');
        const out = document.getElementById('out');
        const meta = document.getElementById('meta');
        const go = document.getElementById('go');
        const ctx = cv.getContext('2d');

        async function streamElaborate(description) {
            const res = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'openai-fast',
                    stream: true,
                    messages: [{
                        role: 'user',
                        content: 'Describe this video frame in 3 short bullet points in Indonesian, based on:\n' + description,
                    }],
                }),
            });
            if (!res.ok) {
                out.textContent = description;
                return description;
            }
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = '', full = '', n = 0;
            out.textContent = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop() || '';
                for (const line of lines) {
                    const t = line.trim();
                    if (!t.startsWith('data:')) continue;
                    const d = t.slice(5).trim();
                    if (d === '[DONE]') continue;
                    try {
                        const j = JSON.parse(d);
                        const c = j.choices?.[0]?.delta?.content || '';
                        if (c) {
                            full += c;
                            n++;
                            out.textContent = full;
                            const cur = document.createElement('span');
                            cur.className = 'cursor';
                            out.appendChild(cur);
                            meta.textContent = 'real-time · chunks=' + n;
                        }
                    } catch {}
                }
            }
            if (!full) {
                out.textContent = description;
                return description;
            }
            out.textContent = full;
            meta.textContent = 'Selesai · ' + n + ' chunks real-time';
            return full;
        }

        go.onclick = async () => {
            go.disabled = true;
            out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
            meta.textContent = 'ekstrak frame…';
            try {
                if (vid.readyState < 2) {
                    await new Promise((res, rej) => {
                        vid.onloadeddata = res;
                        vid.onerror = () => rej(new Error('Video gagal dimuat'));
                        setTimeout(() => rej(new Error('Timeout muat video')), 20000);
                    });
                }
                vid.pause();
                vid.currentTime = Math.min(1, (vid.duration || 2) / 2);
                await new Promise(res => {
                    vid.onseeked = res;
                    setTimeout(res, 3000);
                });
                ctx.drawImage(vid, 0, 0, cv.width, cv.height);
                cv.style.display = 'block';
                const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.9));
                if (!blob) throw new Error('Gagal ambil frame (canvas kosong)');
                meta.textContent = 'kirim frame ke vision…';
                out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
                const fd = new FormData();
                fd.append('file', blob, 'frame.jpg');
                fd.append('options', JSON.stringify({ maxTags: 10 }));
                const r = await fetch('https://aiautotagging.com/api/tag/image', { method: 'POST', body: fd });
                const text = await r.text();
                if (!r.ok) throw new Error('API ' + r.status + ': ' + text.slice(0, 150));
                let result = text;
                try {
                    const j = JSON.parse(text);
                    if (Array.isArray(j.tags) && j.tags.length) {
                        result = j.tags.slice(0, 10).map(t => {
                            const conf = t.confidence != null ? ` (${Math.round(t.confidence * 100)}%)` : '';
                            return '- ' + (t.label || t.name || '') + conf;
                        }).join('\n');
                    } else if (j.raw) {
                        const m = j.raw.match(/Image description:\s*([\s\S]+?)(?:\n\nHere is my approach|\n```|$)/i);
                        result = m ? m[1].trim() : j.raw.slice(0, 700);
                    } else if (j.code) throw new Error(j.message || j.code);
                } catch (e) { if (e.message && !e.message.includes('JSON') && !e.message.includes('Unexpected')) throw e; }
                meta.textContent = 'AI real-time mengalir…';
                out.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
                await streamElaborate(result);
            } catch (e) {
                out.textContent = 'Error: ' + e.message;
                meta.textContent = '';
            } finally {
                go.disabled = false;
            }
        };
    </script>
</body>
</html>
