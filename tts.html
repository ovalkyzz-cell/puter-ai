<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-to-Speech — Gratis</title>
    <link rel="stylesheet" href="features.css">
    <style>
        :root { --c: #818cf8; }
        #text-input { min-height: 110px; font-size: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
        textarea { width: 100%; margin-bottom: 12px; }
        input[type=range] { width: 100%; }
    </style>
</head>
<body>
    <a class="home-pill" href="index.html">◆ Nexus</a>
    <div class="wrap">
        <div class="page-head">
            <div class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            </div>
            <div>
                <h1>Text-to-Speech <span class="badge">GRATIS · TANPA LOGIN</span></h1>
                <p class="note" style="margin:4px 0 0">Web Speech API · tanpa API key · tanpa balance · tanpa limit</p>
            </div>
        </div>

        <div class="presets">
            <button type="button" data-t="Hello! This is free text to speech.">EN: Hello</button>
            <button type="button" data-t="Halo! Ini suara teks ke ucapan gratis.">ID: Halo</button>
            <button type="button" data-t="Bonjour le monde!">FR: Bonjour</button>
            <button type="button" data-t="Hola, ¿cómo estás?">ES: Hola</button>
            <button type="button" data-t="Guten Tag, wie geht es Ihnen?">DE: Guten Tag</button>
        </div>

        <div class="card">
            <h2>Engine suara</h2>
            <textarea id="text-input">Halo! Ini text-to-speech gratis tanpa login dan tanpa balance. Selamat datang di aplikasi AI kami.</textarea>
            <div class="grid">
                <div class="field">
                    <label>Bahasa</label>
                    <select id="lang">
                        <option value="id-ID" selected>Indonesia</option>
                        <option value="en-US">English (US)</option>
                        <option value="en-GB">English (UK)</option>
                        <option value="fr-FR">French</option>
                        <option value="de-DE">German</option>
                        <option value="es-ES">Spanish</option>
                        <option value="it-IT">Italian</option>
                        <option value="ja-JP">Japanese</option>
                        <option value="ko-KR">Korean</option>
                        <option value="ar-SA">Arabic</option>
                    </select>
                </div>
                <div class="field">
                    <label>Voice</label>
                    <select id="voice"><option value="">(default sistem)</option></select>
                </div>
                <div class="field">
                    <label>Kecepatan: <span class="val" id="rate-val">1.0</span></label>
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="field">
                    <label>Pitch: <span class="val" id="pitch-val">1.0</span></label>
                    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>
            <div class="btns">
                <button id="play">▶ Putar</button>
                <button id="pause" class="secondary" hidden>⏸ Jeda</button>
                <button id="resume" class="secondary" hidden>▶ Lanjut</button>
                <button id="stop" class="danger" hidden>■ Stop</button>
            </div>
            <div class="status" id="status">Siap. Klik Putar — suara keluar dari perangkatmu, 100% gratis.</div>
        </div>

        <a class="back" href="index.html">← Chat utama (balasan AI juga bisa 🔊)</a>
    </div>
    <script>
        const $ = (id) => document.getElementById(id);
        const textInput = $('text-input');
        const langSel = $('lang');
        const voiceSel = $('voice');
        const rate = $('rate');
        const pitch = $('pitch');
        const statusEl = $('status');
        const btnPlay = $('play');
        const btnPause = $('pause');
        const btnResume = $('resume');
        const btnStop = $('stop');
        let voices = [];
        let speaking = false;

        function setStatus(msg) { statusEl.textContent = msg; }

        function refreshVoices() {
            voices = speechSynthesis.getVoices();
            const code = langSel.value.slice(0, 2);
            const match = voices.filter(v => v.lang.toLowerCase().replace('_', '-').startsWith(code));
            const list = (match.length ? match : voices).slice(0, 40);
            const prev = voiceSel.value;
            voiceSel.innerHTML = '<option value="">(default sistem)</option>';
            for (const v of list) {
                const o = document.createElement('option');
                o.value = v.name;
                o.textContent = v.name + ' — ' + v.lang;
                voiceSel.appendChild(o);
            }
            if ([...voiceSel.options].some(o => o.value === prev)) voiceSel.value = prev;
            setStatus('Voice tersedia: ' + voices.length + (match.length ? ' (' + match.length + ' cocok ' + langSel.value + ')' : ' (default)') + '\nGratis tanpa limit — putar sesering yang kamu mau.');
        }

        function setButtons(state) {
            speaking = state === 'speaking';
            btnPlay.hidden = state === 'speaking' || state === 'paused';
            btnPause.hidden = state !== 'speaking';
            btnResume.hidden = state !== 'paused';
            btnStop.hidden = state === 'idle';
            btnPlay.disabled = state === 'speaking';
        }

        function play() {
            const text = textInput.value.trim();
            if (!text) return setStatus('Teks kosong.');
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = langSel.value;
            u.rate = parseFloat(rate.value);
            u.pitch = parseFloat(pitch.value);
            const v = voices.find(x => x.name === voiceSel.value);
            if (v) u.voice = v;
            u.onstart = () => { setButtons('speaking'); setStatus('Memutar…\n' + text.slice(0, 120) + (text.length > 120 ? '…' : '')); };
            u.onend = () => { setButtons('idle'); setStatus('Selesai. ✓ Gratis, tanpa balance.'); };
            u.onerror = (e) => {
                setButtons('idle');
                setStatus(e.error === 'synthesis-failed'
                    ? 'Perangkat ini tidak punya output suara (server/headless). Di HP/laptop langsung jalan.'
                    : 'Error: ' + e.error);
            };
            setButtons('speaking');
            speechSynthesis.speak(u);
        }

        btnPlay.onclick = play;
        btnPause.onclick = () => { speechSynthesis.pause(); setButtons('paused'); setStatus('Dijeda.'); };
        btnResume.onclick = () => { speechSynthesis.resume(); setButtons('speaking'); setStatus('Lanjut…'); };
        btnStop.onclick = () => { speechSynthesis.cancel(); setButtons('idle'); setStatus('Dihentikan.'); };
        rate.oninput = () => $('rate-val').textContent = parseFloat(rate.value).toFixed(1);
        pitch.oninput = () => $('pitch-val').textContent = parseFloat(pitch.value).toFixed(1);
        langSel.onchange = refreshVoices;
        document.querySelectorAll('.presets button').forEach(b => {
            b.onclick = () => { textInput.value = b.dataset.t; play(); };
        });

        if (typeof speechSynthesis === 'undefined') {
            setStatus('Browser ini tidak mendukung Web Speech API.');
            btnPlay.disabled = true;
        } else {
            refreshVoices();
            speechSynthesis.onvoiceschanged = refreshVoices;
            setButtons('idle');
        }
    </script>
</body>
</html>
